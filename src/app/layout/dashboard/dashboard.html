<div class="min-h-screen bg-slate-50 md:flex">
  <aside class="w-full shrink-0 border-r border-slate-200 bg-white p-5 md:min-h-screen md:w-60">
    <a routerLink="/dashboard" class="text-2xl font-bold tracking-tight text-indigo-600">
      Nexora
    </a>

    <nav class="space-y-2" style="margin-top: 2rem">
      <a
        [routerLink]="'dashboard'"
        routerLinkActive="bg-indigo-50 text-indigo-700"
        class="block rounded-lg px-3 py-2 text-sm font-medium"
        style="cursor: pointer"
      >
        Dashboard
      </a>

      <a
        [routerLink]="'customers'"
        routerLinkActive="bg-indigo-50 text-indigo-700"
        class="block rounded-lg px-3 py-2 text-sm font-medium"
        style="cursor: pointer"
      >
        Customers
      </a>

      <a
        [routerLink]="'subscriptions'"
        routerLinkActive="bg-indigo-50 text-indigo-700"
        class="block rounded-lg px-3 py-2 text-sm font-medium"
        style="cursor: pointer"
      >
        Subscriptions
      </a>

      <a
        [routerLink]="'transactions'"
        routerLinkActive="bg-indigo-50 text-indigo-700"
        class="block rounded-lg px-3 py-2 text-sm font-medium"
        style="cursor: pointer"
      >
        Transactions
      </a>
    </nav>
  </aside>

  <main class="min-w-0 flex-1 p-5 md:p-8">
    <router-outlet />
  </main>
</div>
